[package]
name = "maki-sudo"
version = "0.1.0"
edition = "2021"
publish = false
description = "sudo's approval plugin for maki: each command waits for your yes on maki"
license = "BSD-3-Clause"

[lib]
name = "maki_sudo"
# the plugin sudo loads, and the same code for the tests
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22"
ed25519-dalek = "2"
getrandom = "0.2"
libc = "0.2"
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
